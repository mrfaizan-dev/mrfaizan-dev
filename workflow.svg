ion dur="2s" begin="0.5s" repeatCount="indefinite" path="M600,185 L660,185"/></circle><g transform="translate(660,110)"><rect width="240" height="150" rx="22" fill="#0b1224" stroke="#818cf8" stroke-opacity=".6" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;1;.3" dur="5s" begin="2s" repeatCount="indefinite"/></rect><circle cx="120" cy="52" r="26" fill="#818cf8" fill-opacity=".15" stroke="#818cf8"/><text x="120" y="61" text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#818cf8">3</text><text x="120" y="108" text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">Orchestrate</text><text x="120" y="136" text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">LangGraph agents</text></g><line x1="900" y1="185" x2="960" y2="185" stroke="#334155" stroke-width="3"/><circle r="6" fill="#818cf8"><animateMotion dur="2s" begin="1.0s" repeatCount="indefinite" path="M900,185 L960,185"/></circle><g transform="translate(960,110)"><rect width="240" height="150" rx="22" fill="#0b1224" stroke="#c084fc" stroke-opacity=".6" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;1;.3" dur="5s" begin="3s" repeatCount="indefinite"/></rect><circle cx="120" cy="52" r="26" fill="#c084fc" fill-opacity=".15" stroke="#c084fc"/><text x="120" y="61" text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#c084fc">4</text><text x="120" y="108" text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">Validate</text><text x="120" y="136" text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">Pydantic schemas</text></g><line x1="1200" y1="185" x2="1260" y2="185" stroke="#334155" stroke-width="3"/><circle r="6" fill="#c084fc"><animateMotion dur="2s" begin="1.5s" repeatCount="indefinite" path="M1200,185 L1260,185"/></circle><g transform="translate(1260,110)"><rect width="240" height="150" rx="22" fill="#0b1224" stroke="#e879f9" stroke-opacity=".6" stroke-width="2"><animate attributeName="stroke-opacity" values=".3;1;.3" dur="5s" begin="4s" repeatCount="indefinite"/></rect><circle cx="120" cy="52" r="26" fill="#e879f9" fill-opacity=".15" stroke="#e879f9"/><text x="120" y="61" text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e879f9">5</text><text x="120" y="108" text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">Deliver</text><text x="120" y="136" text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">API · Excel · CSV</text></g>
